<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحفظة الشخصية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>مرحباً بك في موقعي الشخصي</h1>
        <nav>
            <ul>
                <li><a href="#about">عني</a></li>
                <li><a href="#projects">مشاريعي</a></li>
                <li><a href="#contact">تواصل معي</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>نبذة عني</h2>
            <!-- تم إضافة النص البديل alt لإمكانية الوصول -->
            <img src="https://via.placeholder.com/150" alt="صورة شخصية لصاحب المحفظة">
            <p>أنا مطور ويب مبتدئ وأعمل على تطوير مهاراتي في HTML وCSS وJavaScript.</p>
        </section>

        <section id="projects">
            <h2>مشاريعي</h2>
            <article class="project-card">
                <h3>مشروع تطوير الويب</h3>
                <p>موقع ويب بسيط تم بناؤه باستخدام التقنيات الأساسية.</p>
            </article>
        </section>

        <section id="contact">
            <h2>تواصل معي</h2>
            <button id="contactBtn">اضغط للتواصل</button>
            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
